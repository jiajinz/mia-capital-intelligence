[project]
name = "mia-capital-intelligence"
version = "0.1.0"
description = "Airport infrastructure and capital projects explorer"
requires-python = ">=3.13"
dependencies = [
    "duckdb==1.4.3",
    "jsonschema==4.25.1",
    "pdfplumber==0.11.9",
    "pypdfium2==5.14.0",
    "streamlit==1.51.0",
    "pandas==2.3.3",
    "plotly==6.3.1",
]

[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: requires optional audit dependencies and local pinned PDFs"]

[tool.coverage.run]
branch = true
parallel = true
patch = ["subprocess"]
relative_files = true
source = ["."]
data_file = "tmp/coverage/.coverage"
omit = [
    ".venv/*",
    "tests/*",
    "tmp/*",
    "scripts/report_test_coverage.py",
]

[tool.coverage.report]
precision = 2
show_missing = true
include_namespace_packages = true

[tool.coverage.json]
output = "tmp/coverage/coverage.json"

[tool.coverage.html]
directory = "tmp/coverage/html"

[tool.coverage.xml]
output = "tmp/coverage/coverage.xml"
