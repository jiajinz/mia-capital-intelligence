[project]
name = "mia-capital-intelligence"
version = "0.1.0"
description = "Independent airport capital program and infrastructure decision support"
requires-python = ">=3.13"
dependencies = [
    "duckdb==1.4.3",
    "jsonschema==4.25.1",
    "pdfplumber==0.11.9",
    "pypdfium2==5.14.0",
]

[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: requires optional audit dependencies and local pinned PDFs"]
