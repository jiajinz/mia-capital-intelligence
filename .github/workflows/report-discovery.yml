name: Discover official reports

on:
  schedule:
    - cron: "43 9 * * *"
  workflow_dispatch:
    inputs:
      full_hash_check:
        description: Download known PDFs without conditional cache headers
        type: boolean
        default: false
  pull_request:
    paths:
      - ".github/workflows/report-discovery.yml"
      - "src/mia_capital_intelligence/discovery_*.py"
      - "scripts/discover_official_reports.py"
      - "scripts/publish_report_discovery.py"
      - "tests/test_discovery_*.py"
      - "schemas/discovery_catalog.schema.json"
      - "data/discovery/**"
      - "docs/DATA_UPDATES.md"
      - "requirements-discovery.txt"

permissions:
  contents: read

concurrency:
  group: official-report-discovery
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-discovery.txt -r requirements-dev.txt
      - name: Verify discovery, version history and publication controls
        run: python -m pytest tests/test_discovery_sources.py tests/test_discovery_scan.py tests/test_discovery_publication.py

  scan:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      bundle_ready: ${{ steps.bundle.outputs.ready }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-discovery.txt
      - name: Load earlier candidate history
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_report_discovery.py prepare --path tmp/discovery-previous.json
      - name: Scan official indexes and PDF versions
        env:
          FULL_HASH_CHECK: ${{ inputs.full_hash_check }}
        run: |
          args=()
          if [ "$FULL_HASH_CHECK" = "true" ]; then
            args+=(--full-hash-check)
          fi
          python scripts/discover_official_reports.py --previous-catalog tmp/discovery-previous.json "${args[@]}"
      - name: Check candidate bundle
        id: bundle
        if: always()
        run: |
          if [ -f tmp/discovery-run/catalog.json ] && [ -f tmp/discovery-run/report.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Preserve candidate metadata and scan results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: report-discovery-bundle
          path: |
            tmp/discovery-run/catalog.json
            tmp/discovery-run/report.json
            tmp/discovery-run/summary.md
          retention-days: 30
          if-no-files-found: ignore
      - name: Preserve discovered PDF versions
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: official-report-pdfs
          path: tmp/discovery-run/pdfs/*.pdf
          retention-days: 30
          if-no-files-found: ignore

  propose:
    if: always() && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && needs.scan.outputs.bundle_ready == 'true'
    needs: scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-discovery.txt
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: report-discovery-bundle
          path: tmp/discovery-bundle
      - name: Propose catalog and public log changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_report_discovery.py publish --path tmp/discovery-bundle
