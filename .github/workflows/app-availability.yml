name: Check app availability

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/app-availability.yml"
      - "scripts/check_app_availability.py"

permissions:
  contents: read

concurrency:
  group: app-availability
  cancel-in-progress: false

jobs:
  visit-app:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install browser
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Open the public app and verify records
        run: python scripts/check_app_availability.py
